openapi: 3.0.3
info:
  title: TurbineOps Lite REST API
  version: 0.1.0
  description: REST API for TurbineOps Lite - Wind Turbine Management System
servers:
  - url: http://localhost:4000/api/v1
    description: Development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [ADMIN, ENGINEER, VIEWER]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string

    Inspection:
      type: object
      properties:
        id:
          type: string
        turbineId:
          type: string
        date:
          type: string
          format: date-time
        inspectorName:
          type: string
        dataSource:
          type: string
          enum: [DRONE, MANUAL]
        rawPackageUrl:
          type: string
          nullable: true
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        turbine:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Finding:
      type: object
      properties:
        id:
          type: string
        category:
          type: string
          enum: [BLADE_DAMAGE, LIGHTNING, EROSION, UNKNOWN]
        severity:
          type: integer
          minimum: 1
          maximum: 10
        estimatedCost:
          type: number
          minimum: 0
        notes:
          type: string
          nullable: true

    InspectionList:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Inspection'
        meta:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer
    RepairPlan:
      type: object
      properties:
        id:
          type: string
        inspectionId:
          type: string
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        totalEstimatedCost:
          type: number
          minimum: 0
        snapshotJson:
          description: Adjusted findings snapshot used to generate the plan
          nullable: true
        inspection:
          type: object
          properties:
            id:
              type: string
            turbineId:
              type: string
            turbine:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RepairPlanList:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/RepairPlan'
        meta:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer

paths:
  /healthz:
    get:
      summary: Health check
      tags:
        - Health
      responses:
        '200':
          description: OK

  /auth/register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                name:
                  type: string
                role:
                  type: string
                  enum: [ADMIN, ENGINEER, VIEWER]
                  default: VIEWER
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/AuthResponse'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      summary: Login user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/profile:
    get:
      summary: Get current user profile
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Update user profile
      tags:
        - Authentication
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/change-password:
    post:
      summary: Change user password
      tags:
        - Authentication
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
        '401':
          description: Unauthorized or invalid current password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /turbines:
    get:
      summary: List turbines
      tags:
        - Turbines
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: OK
      security:
        - bearerAuth: []
    post:
      summary: Create turbine
      tags:
        - Turbines
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Requires ADMIN or ENGINEER role

  /turbines/{id}:
    get:
      summary: Get turbine by ID
      tags:
        - Turbines
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Requires ADMIN or ENGINEER role
        '404':
          description: Turbine not found
    patch:
      summary: Update turbine
      tags:
        - Turbines
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Requires ADMIN or ENGINEER role
        '404':
          description: Turbine not found
    delete:
      summary: Delete turbine
      tags:
        - Turbines
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Requires ADMIN role
        '404':
          description: Turbine not found

  /inspections/search:
    post:
      summary: Search inspections
      tags:
        - Inspections
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  minimum: 1
                  default: 1
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 10
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
                turbineId:
                  type: string
                dataSource:
                  type: string
                  enum: [DRONE, MANUAL]
                searchNotes:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionList'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Requires ADMIN or ENGINEER role

  /inspections:
    post:
      summary: Create inspection
      tags:
        - Inspections
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [turbineId, date, inspectorName, dataSource, findings]
              properties:
                turbineId:
                  type: string
                date:
                  type: string
                  format: date-time
                inspectorName:
                  type: string
                dataSource:
                  type: string
                  enum: [DRONE, MANUAL]
                rawPackageUrl:
                  type: string
                  nullable: true
                findings:
                  type: array
                  items:
                    $ref: '#/components/schemas/Finding'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Inspection'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Requires ADMIN or ENGINEER role

  /inspections/{id}:
    get:
      summary: Get inspection by ID
      tags:
        - Inspections
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Inspection'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Requires ADMIN or ENGINEER role
        '404':
          description: Inspection not found
    patch:
      summary: Update inspection
      tags:
        - Inspections
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inspectorName:
                  type: string
                date:
                  type: string
                  format: date-time
                dataSource:
                  type: string
                  enum: [DRONE, MANUAL]
                rawPackageUrl:
                  type: string
                findings:
                  type: array
                  items:
                    $ref: '#/components/schemas/Finding'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Inspection'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Requires ADMIN or ENGINEER role
        '404':
          description: Inspection not found
    delete:
      summary: Delete inspection
      tags:
        - Inspections
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Requires ADMIN role
        '404':
          description: Inspection not found

  /repair-plans/search:
    post:
      summary: Search repair plans
      tags:
        - Repair Plans
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  minimum: 1
                  default: 1
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 10
                priority:
                  type: string
                  enum: [LOW, MEDIUM, HIGH]
                turbineId:
                  type: string
                minTotalEstimatedCost:
                  type: number
                  minimum: 0
                maxTotalEstimatedCost:
                  type: number
                  minimum: 0
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepairPlanList'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Requires ADMIN or ENGINEER role

  /events:
    get:
      summary: Server-Sent Events stream for realtime notifications
      tags:
        - Notifications
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
                example: "event: repair-plan.created\\ndata: {\\\"inspectionId\\\":\\\"abc\\\",\\\"plan\\\":{\\\"id\\\":\\\"rp1\\\",\\\"priority\\\":\\\"HIGH\\\",\\\"totalEstimatedCost\\\":1234,\\\"createdAt\\\":\\\"2024-01-01T00:00:00.000Z\\\"}}\\n\\n"
